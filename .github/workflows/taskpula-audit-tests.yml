name: TaskPula audit preflight

on:
  push:
    branches:
      - chore/taskpula-ci-infrastructure
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taskpula-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-runtime-checks:
    name: Static and runtime checks (no production credentials)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          set -e
          for file in *.js; do
            [ -f "$file" ] && node --check "$file"
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run migration contract checks
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check banner tracking Edge Function
        run: deno check supabase/functions/taskpula-banner-track/index.ts

      - name: Check patch whitespace
        run: git diff --check
